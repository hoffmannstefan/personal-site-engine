spring.application.name=homepage-frontend
server.port=${PORT:8080}

# Where the backend runs: it serves the content (site.yaml, posts, publications, images) and the comments.
frontend.backend-url=${BACKEND_URL:http://localhost:8081}
# A backend that does not answer makes a page fail with 503 instead of hanging.
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=10s

# The site is English only; dates render the same for every visitor, whatever the browser's language.
spring.web.locale=en
spring.web.locale-resolver=fixed

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.web.resources.cache.cachecontrol.max-age=1h
server.compression.enabled=true
server.error.include-message=always
