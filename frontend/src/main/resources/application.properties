spring.application.name=homepage-frontend
server.port=${PORT:8080}

# Where the backend runs: it serves the content (site.yaml, posts, publications, images) and the comments.
frontend.backend-url=${BACKEND_URL:http://localhost:8081}
# A backend that does not answer makes a page fail with 503 instead of hanging.
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=10s

# The site is English only; dates render the same for every visitor, whatever the browser's language.
spring.web.locale=en
spring.web.locale-resolver=fixed

# OpenTelemetry: traces (HTTP, calls to the backend), metrics (HTTP, JVM) and logs, sent over OTLP (http/protobuf).
# Calls to the backend carry the trace in traceparent, so one trace covers a page request in both services. Off until
# a receiver exists: set OTEL_SDK_DISABLED=false and OTEL_EXPORTER_OTLP_ENDPOINT (e.g. http://collector:4318).
otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
# Identifies this service in every span, metric and log record.
otel.service.name=${spring.application.name}
# Where it runs: local by default, production when deployed by CI (env DEPLOYMENT_ENVIRONMENT).
otel.resource.attributes[deployment.environment.name]=${DEPLOYMENT_ENVIRONMENT:local}
# What is deployed: the commit hash in images built by CI (env SERVICE_VERSION), else the project version.
otel.resource.attributes[service.version]=${SERVICE_VERSION:@project.version@}

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.web.resources.cache.cachecontrol.max-age=1h
server.compression.enabled=true
server.error.include-message=always
