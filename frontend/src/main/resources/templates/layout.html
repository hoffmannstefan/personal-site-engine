<!DOCTYPE html>
<!--/* The skeleton of every page. A page passes its title (or null), the active menu entry and its own content. */-->
<html th:fragment="layout(title, active, view)" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title th:text="${title != null ? title + ' | ' : ''} + ${site.title}">Stefan Hoffmann</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="author" th:content="${site.author}">
  <meta name="description" th:content="${site.description}">
  <meta name="keywords" th:content="${site.keywords}">

  <link rel="preload" href="/fonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/css/coder.min.css" media="screen">
  <link rel="stylesheet" href="/css/coder-dark.min.css" media="screen">
  <link rel="stylesheet" href="/css/site.css" media="screen">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body class="preload-transitions colorscheme-auto">
<div class="float-container">
  <a id="dark-mode-toggle" class="colorscheme-toggle">
    <i class="fa-solid fa-adjust fa-fw" aria-hidden="true"></i>
  </a>
</div>
<main class="wrapper">
  <nav class="navigation">
    <section class="container">
      <a class="navigation-title" href="/" th:text="${site.title}">Stefan Hoffmann</a>
      <input type="checkbox" id="menu-toggle" />
      <label class="menu-button float-right" for="menu-toggle">
        <i class="fa-solid fa-bars fa-fw" aria-hidden="true"></i>
      </label>
      <ul class="navigation-list">
        <li class="navigation-item">
          <a class="navigation-link" th:classappend="${active == 'home'} ? 'active'" href="/">Home</a>
        </li>
        <li class="navigation-item">
          <a class="navigation-link" th:classappend="${active == 'posts'} ? 'active'" href="/posts/">Blog</a>
        </li>
        <li class="navigation-item">
          <a class="navigation-link" th:classappend="${active == 'publications'} ? 'active'" href="/publications/">Publications</a>
        </li>
      </ul>
    </section>
  </nav>

  <div class="content" th:insert="${view}"></div>

  <footer class="footer">
    <section class="container">
      Built with <a href="https://spring.io/projects/spring-boot" th:target="${site.externalLinksInNewTab} ? '_blank'" th:rel="${site.externalLinksInNewTab} ? 'noopener'">Spring Boot</a>
      and <a href="https://www.thymeleaf.org/" th:target="${site.externalLinksInNewTab} ? '_blank'" th:rel="${site.externalLinksInNewTab} ? 'noopener'">Thymeleaf</a>,
      loosely styled after the <a href="https://github.com/luizdepra/hugo-coder/" th:target="${site.externalLinksInNewTab} ? '_blank'" th:rel="${site.externalLinksInNewTab} ? 'noopener'">Hugo Coder</a> theme.
    </section>
  </footer>
</main>
<script src="/js/coder.min.js"></script>
</body>
</html>
