  # Markdown; an empty line starts a new paragraph.
  text: |
    I am a data engineer in PropTech at [on-geo GmbH](https://www.on-geo.de/), part of the Accumin Group, where I
    work with real estate data. I focus on data modelling, verification and data quality, working with Airflow,
    Python, SQL (PostgreSQL, MS SQL), dbt and Great Expectations.

    Previously, I worked as a data scientist and full-stack developer at a psychiatric hospital, using Java, MySQL,
    MS Access and Apache Tomcat. I also spent several years as a researcher in theoretical computer science, working
    on automata synchronisation and the theoretical foundations of software verification. You can find some of my
    scholarly work and original research here as well.

    WARNING: This site is still under construction. I'm just testing my new vServer. Images, descriptions, blog
    posts, and much more content will be added soon. Meanwhile, my old homepage is reachable
    [here](https://hoffmannstefan.github.io).
