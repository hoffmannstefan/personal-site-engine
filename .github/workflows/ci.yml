# Builds and tests pushes to main and pull requests. Pushes to main also publish the
# Docker images of the backend and the frontend to the GitHub Container Registry
# (ghcr.io) and deploy them, together with compose.yaml and the content in info/,
# to the server.
name: CI

on:
  push:
    branches: [main]
    # Changes to these files alone neither test nor deploy anything. Not all *.md files:
    # the posts in info/posts/ are Markdown too and must still be deployed.
    paths-ignore:
      - README.md
      - TODO.md
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the server (also when DEPLOY_ENABLED is not true)
        type: boolean
        default: false

# A newer push to a branch cancels the run that is still going. Runs on main are
# never cancelled, so a deployment cannot be interrupted halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "*/target/surefire-reports/"

  image:
    name: Docker image (${{ matrix.module }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version both services report in their telemetry: the commit, as in the sha-… image tag.
      - name: Version
        id: version
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.module }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Pull requests only check that the image builds; nothing is pushed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            MODULE=${{ matrix.module }}
            VERSION=${{ steps.version.outputs.short }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  # Server access comes from repository secrets (Settings → Secrets and variables → Actions):
  #   DEPLOY_HOST          address of the server
  #   DEPLOY_USER          SSH user, needs access to Docker
  #   DEPLOY_PATH          folder on the server with compose.yaml, info/ and data/
  #   DEPLOY_SSH_KEY       private key whose public key is in the user's authorized_keys
  #   DEPLOY_KNOWN_HOSTS   output of `ssh-keyscan <host>`, so the server's identity is checked
  #
  # When it runs, only from main:
  #   push                 if the repository variable DEPLOY_ENABLED is 'true'
  #                        (Settings → Secrets and variables → Actions → Variables)
  #   Run workflow         if "Deploy" is ticked, whatever DEPLOY_ENABLED says
  # Otherwise the job is skipped and the run stays green.
  deploy:
    name: Deploy
    needs: image
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.stefan-hoffmann.de
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      # Reported in the telemetry of both services as deployment.environment.name.
      DEPLOYMENT_ENVIRONMENT: production
    steps:
      # Fails instead of deploying to a half-configured target, e.g. rsync to / with an empty DEPLOY_PATH.
      - name: Check secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Deployment is switched on, but these secrets are missing:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
          EOF

      # info/ is mirrored: files deleted in the repository are deleted on the server too.
      # data/ (comments database) and .env (admin token) on the server are left alone.
      - name: Copy compose.yaml and info/
        run: |
          rsync -rltvz --chmod=D755,F644 compose.yaml "server:$DEPLOY_PATH/compose.yaml"
          rsync -rltvz --delete --chmod=D755,F644 info/ "server:$DEPLOY_PATH/info/"

      # Recreated even when only content changed, because posts and settings are read at startup.
      # --remove-orphans stops containers of services no longer in compose.yaml (the single
      # "homepage" container from before the split into backend and frontend).
      - name: Pull the new images and restart
        run: |
          ssh server "set -e
            cd '$DEPLOY_PATH'
            export DEPLOYMENT_ENVIRONMENT='$DEPLOYMENT_ENVIRONMENT'
            docker compose pull
            docker compose up -d --no-build --force-recreate --remove-orphans
            docker image prune -f"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
