# A single Tempo process with its data on the filesystem (volume /var/tempo). Traces arrive over OTLP from the
# collector.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 720h   # 30 days, as for metrics and logs

usage_report:
  reporting_enabled: false
