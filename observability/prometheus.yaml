# Metrics arrive over OTLP from the collector; nothing is scraped.
global:
  evaluation_interval: 1m

otlp:
  # Copied from the resource onto every series as deployment_environment_name and service_version, so every
  # query and the dashboard can filter by them. service.name becomes the label job.
  promote_resource_attributes:
    - deployment.environment.name
    - service.version

storage:
  tsdb:
    # OTLP pushes may arrive slightly out of order.
    out_of_order_time_window: 30m
