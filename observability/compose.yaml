# Observability stack for Personal Site Engine, a Compose project of its own, separate from the application.
#
#   docker compose -f observability/compose.yaml up -d                                      # this stack
#   docker compose -f compose.yaml -f observability/connect-app.yaml up -d --build          # the app, sending to it
#
# The application sends traces, metrics and logs over OTLP to the collector, which passes them on to Tempo,
# Prometheus and Loki. Grafana shows all three, with the dashboard "Personal Site" (http://localhost:3000).
# Only Grafana has a port on the host; the app reaches the collector through the network "observability".
name: observability

services:
  # Receives OTLP from the app and passes each signal on to where it is stored.
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  # Metrics, received from the collector over OTLP; environment and version become labels.
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # Logs, received from the collector over OTLP.
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  # Traces, received from the collector over OTLP.
  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      # Only on this machine by default; set GRAFANA_ADDRESS=0.0.0.0 to open it to the network.
      - "${GRAFANA_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Dashboards can be viewed without logging in; changing them needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/personal-site.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

networks:
  default:
    # A fixed name, so the application's Compose project can join it (see connect-app.yaml).
    name: observability

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
