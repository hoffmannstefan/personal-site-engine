# A single Loki process with its data on the filesystem (volume /loki). Logs arrive over OTLP from the collector.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 30d
  otlp_config:
    resource_attributes:
      # Besides service_name: environment and version as stream labels, so log queries can filter by them.
      attributes_config:
        - action: index_label
          attributes:
            - deployment.environment.name
            - service.version

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
