spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
site.comments.admin-token=secret
site.comments.max-per-minute=1000
# Publications for the tests, so they do not depend on ./info/publications.bib
site.publications-file=src/test/resources/publications-test.bib
# Site configuration and images for the tests, so they do not depend on ./info
site.config-file=src/test/resources/info/site.yaml
site.images-dir=src/test/resources/info/images
# Copies of the demo posts, so the tests do not depend on ./info/posts
site.posts-dir=src/test/resources/info/posts
