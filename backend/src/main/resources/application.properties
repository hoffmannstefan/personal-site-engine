spring.application.name=homepage-backend
# Only the frontend talks to the backend; it listens on 8080.
server.port=${PORT:8081}

# Name, texts and start page of the site (title, author, home, ...), read at startup.
site.config-file=${SITE_CONFIG:./info/site.yaml}
# Folder with your own Markdown posts (*.md), read at startup; ignored if it does not exist.
site.posts-dir=${POSTS_DIR:./info/posts}
site.comments.max-per-minute=5
# Set to enable DELETE /api/comments/{id} (send it as the X-Admin-Token header).
site.comments.admin-token=${COMMENTS_ADMIN_TOKEN:}
# BibTeX file with the list on the Publications page, read at startup; the page shows "Coming soon." if it does not exist.
site.publications-file=${PUBLICATIONS_FILE:./info/publications.bib}
# Images of the start page (avatar, link icons), served under /images/.
site.images-dir=${IMAGES_DIR:./info/images}

# Comments live in a file-based H2 database. Point these at PostgreSQL/MySQL for production.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/comments;AUTO_SERVER=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The frontend passes on the visitor's address in X-Forwarded-For, so the comment rate limit counts per visitor and
# not per frontend. Only trusted from private and loopback addresses (Docker network, localhost).
server.forward-headers-strategy=native

spring.web.resources.cache.cachecontrol.max-age=1h
server.compression.enabled=true
server.error.include-message=always
